<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 🎰</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>
    <div class="dashboard-container">
        <header>
            <h1>¡Bienvenido! 🎰</h1>
            <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar Sesión</a>
        </header>

        <div class="dashboard-content">
            <div class="action-cards">
                <!-- Tarjeta de multijugador -->
                <div class="action-card" id="multijugador-card">
                    <h3>Multijugador 👥</h3>
                    <p>crear una sala con amigos</p>
                </div>
                <button type="submit" id="btn-sala" class="play-btn">Crear sala o Unirse </button>

                <!-- Formulario para unirse a una sala existente -->
                <div class="action-card" id="unirse-sala-card">
                    <h3>Unirse a una Sala 🕹️</h3>
                    <form id="unirse-sala-form" method="POST" action="{{ url_for('unirse_sala') }}">
                        <label for="codigo_sala">Código de la sala:</label>
                        <input type="text" id="codigo_sala" name="codigo_sala" required>
                        <button type="submit" class="play-btn">Unirse</button>
                    </form>
                </div>


                <!-- Juego individual -->
                <div class="action-card solo-card">
                    <h3>Juego Individual 🎮</h3>
                    <form method="POST" action="{{ url_for('dashboard') }}">
                        <div class="form-group">
                            <label for="cantidad_cartones">Número de cartones:</label>
                            <input type="number" id="cantidad_cartones" name="cantidad_cartones" min="1" max="5"
                                value="1" required>
                        </div>
                        <button type="submit" class="play-btn">Jugar Ahora 🎉</button>
                    </form>
                </div>
            </div>

            <!-- Historial de partidas -->
            <a href="{{ url_for('partidas', usuario_id=session['usuario_id']) }}" class="history-link">
                Ver mi historial de partidas 🏆
            </a>
        </div>
    </div>

    <script>
        // Redirección al modo multijugador
        document.getElementById('multijugador-card').addEventListener('click', function () {
            window.location.href = "{{ url_for('multijugador') }}";
        });
    </script>

    <!-- Carga de JS principal -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
<script>
    // Redirección al modo multijugador
    document.getElementById('multijugador-card').addEventListener('click', function () {
        window.location.href = "{{ url_for('multijugador') }}";
    });

    // Crear sala al hacer clic en el botón
    document.getElementById('btn-sala').addEventListener('click', async function () {
        try {
            const response = await fetch('{{ url_for("crear_sala") }}');
            const data = await response.json();

            if (data.success) {
                // Redirige a la sala con el ID generado
                window.location.href = `/sala/${data.sala_id}`;
            } else {
                alert("Error al crear la sala: " + data.message);
            }
        } catch (error) {
            console.error("Hubo un error:", error);
            alert("Hubo un error al intentar crear la sala.");
        }
    });
</script>

</html>
